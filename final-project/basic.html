<!DOCTYPE html>
<html lang="jp">
    <head>
        <meta charset="UTF-8">
        <title>私の自己紹介</title>
        <style>
            body {
                background-color: #3D3F67;
                color: #FAE3A3;
                text-align: center;
            }

            hr {
                border: 1px solid #FAE3A3;
            }

            h1 {
                text-align: center;
                font-size: 20px;
                font-weight: bold;
            }

            .profile-image {
                display: block;
                margin: auto;
                width: 200px;
                height: 200px;
                border-radius: 50%;
            }

            .self-introduction {
                line-height: 2;
                color: #8AD75E;
            }

            .name {
                text-align: center;
                font-size: 20px;
                font-weight: bold;
            }

            table {
                width: 300px;
                margin: auto;
                border: 1px solid #FAE3A3;
            }
        
            ul {
                width: 300px;
                margin: auto;
            }
            li {
                text-align: left;
            }

            ol {
                width: 300px;
                margin: auto;
            }
        </style>
    </head>
    <body>
        <h1>自己紹介</h1>
        <hr>
        <!--htmlファイルと同じ階層にimagesフォルダを作成しその中にprofile.jpgを置く-->
        <img class="profile-image" src="./images/profile.jpg" alt="プロフィール画像">
        <p class="name">山田　太郎（やまだ　たろう）</p>
        <p class="self-introduction">
            はじめまして！山田太郎（やまだ たろう）です。<br>
            ゲームを作るのが大好きで、日々いろいろなアイデアを形にしています。<br>
            趣味は読書やプログラミング、そしてゲームをプレイすることも大好きです。<br>
            このページでは、私の基本情報や好きなことについて紹介しています。<br>
            ぜひ、最後までご覧ください！
        </p>
        <hr>
        <h2>基本情報</h2>
        <table border="1">
            <tr>
                <th>生年月日</th>
                <td>2000年1月1日</td>
            </tr>
            <tr>
                <th>血液型</th>
                <td>B型</td>
            </tr>
        </table>
        <h2>趣味</h2>
        <ul>
            <li>読書</li>
            <li>ゲーム</li>
            <li>プログラミング</li>
        </ul>
        <h2>好きな食べ物ランキング</h2>
        <ol>
            <li>ステーキ</li>
            <li>ハンバーグ</li>
            <li>ピザ</li>
        </ol>

</html>
